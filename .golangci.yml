run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - misspell

issues:
  exclude-rules:
    - text: "Error return value of .*(Close|Rollback|Sync).*is not checked"
      linters:
        - errcheck
  max-issues-per-linter: 50
  max-same-issues: 5