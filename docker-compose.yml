services:
 postgres:
  image: postgres:16-alpine
  container_name: goflow_postgres
  environment:
   POSTGRES_USER: goflow
   POSTGRES_PASSWORD: goflow_secret
   POSTGRES_DB: goflow_db
  ports:
   - "5432:5432"
  volumes:
   - postgres_data:/var/lib/postgresql/data

 redis:
  image: redis:7-alpine
  container_name: goflow_redis
  ports:
   - "6379:6379"

volumes:
 postgres_data: