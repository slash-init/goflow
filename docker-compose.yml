services:
  postgres:
    image: postgres:16-alpine
    container_name: goflow_postgres
    environment:
      POSTGRES_USER: goflow
      POSTGRES_PASSWORD: goflow_secret
      POSTGRES_DB: goflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: goflow_redis
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:latest
    container_name: goflow_prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:z
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: goflow_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  grafana_data: